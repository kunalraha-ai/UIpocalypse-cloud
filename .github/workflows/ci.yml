name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: uipoc
          POSTGRES_PASSWORD: uipoc
          POSTGRES_DB: uipocalypse_cloud
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U uipoc"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_URL: http://localhost:4311
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      DATABASE_URL: postgres://uipoc:uipoc@localhost:5435/uipocalypse_cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
