# UIpocalypse Cloud — local dev environment. Nothing here is production.
services:
  postgres:
    image: postgres:17-alpine
    container_name: uipoc-cloud-postgres
    environment:
      POSTGRES_USER: uipoc
      POSTGRES_PASSWORD: uipoc
      POSTGRES_DB: uipocalypse_cloud
    ports:
      - "5435:5432"
    volumes:
      - uipoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uipoc -d uipocalypse_cloud"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  uipoc-pgdata:
