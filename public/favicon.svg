<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- UIpocalypse logo mark, scaled 2x from the CSS (.logo-mark): acid square,
       olive border, -3deg tilt, three dark bars at 48% / 85% / 65% height. -->
