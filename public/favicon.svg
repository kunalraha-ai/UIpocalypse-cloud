    <rect x="3" y="3" width="58" height="58" fill="#c8ff2e" stroke="#637f0d" stroke-width="2"/>
    <rect x="13" y="33" width="10" height="18" fill="#16180f"/>
    <rect x="27" y="19" width="10" height="32" fill="#16180f"/>
    <rect x="41" y="26" width="10" height="25" fill="#16180f"/>
  </g>
</svg>
